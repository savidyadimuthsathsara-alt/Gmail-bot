<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Farmer Admin</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .hidden { display: none; }
        input { padding: 10px; width: 70%; border-radius: 5px; border: none; margin-bottom: 10px; }
        button { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        .code { background: #f59e0b; color: black; padding: 10px; font-weight: bold; font-size: 28px; border-radius: 5px; display: inline-block; margin: 10px 0; letter-spacing: 2px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; text-align: left; }
        th { background: #0f172a; }
        .online { color: #22c55e; font-weight: bold; }
        .offline { color: #ef4444; font-weight: bold; }
        .badge { background: #334155; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Login Section -->
    <div id="loginSection">
        <h2>🔐 Admin Login</h2>
        <input type="password" id="password" placeholder="Enter Dashboard Password">
        <button onclick="login()">Login</button>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>📊 Gmail Farmer Dashboard</h2>
            <button onclick="logout()" style="background: #ef4444;">Logout</button>
        </div>
        
        <div style="background: #0f172a; padding: 20px; border-radius: 8px; margin-top: 15px; text-align: center;">
            <h3>Bot Status: <span id="botStatus" class="offline">Checking...</span></h3>
            <p style="color: #94a3b8;">WhatsApp Pairing Code:</p>
            <div id="pairingCode" class="code">Wait...</div>
            <p style="font-size: 12px; color: #94a3b8;">WhatsApp > Linked Devices > Link with phone number > Enter code</p>
        </div>

        <h3 style="margin-top: 30px;">👥 Users & Balances</h3>
        <table>
            <thead>
                <tr>
                    <th>WhatsApp User</th>
                    <th>Balance (LKR)</th>
                    <th>Tasks Done</th>
                </tr>
            </thead>
            <tbody id="userTable">
                <!-- Users will load here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let refreshInterval;

    function login() {
        const pass = document.getElementById('password').value;
        // මේ පාස්වර්ඩ් එක Railway එකේ DASHBOARD_PASSWORD එකට සමාන විය යුතුයි
        if (pass) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            loadDashboard();
            refreshInterval = setInterval(loadDashboard, 5000); // සෙකන්ද් 5න් 5ට අප්ඩේට් වේ
        } else {
            alert("කරුණාකර මුරපදය ඇතුළත් කරන්න!");
        }
    }

    function logout() {
        clearInterval(refreshInterval);
        document.getElementById('password').value = '';
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('dashboardSection').classList.add('hidden');
    }

    async function loadDashboard() {
        try {
            const response = await fetch('/api/dashboard');
            const data = await response.json();

            // Status Update
            const statusEl = document.getElementById('botStatus');
            statusEl.innerText = data.status === 'connected' ? '🟢 Online' : '🔴 Offline';
            statusEl.className = data.status === 'connected' ? 'online' : 'offline';

            // Pairing Code Update
            document.getElementById('pairingCode').innerText = data.pairingCode || 'Connected';

            // Users Update
            const tbody = document.getElementById('userTable');
            tbody.innerHTML = '';
            if(data.users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No users yet.</td></tr>';
            }
            data.users.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="badge">${user.id.split('@')[0]}</span></td>
                    <td style="color: #22c55e; font-weight: bold;">රු. ${user.balance.toFixed(2)}</td>
                    <td>${user.tasks_completed}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.log("Error loading dashboard data");
        }
    }
</script>

</body>
</html>
